name: Unsigned desktop release
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  build:
    name: Build (${{ matrix.os }})
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - name: Verify tag matches package version
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: bun -e 'const p=require("./package.json"); if (process.env.RELEASE_TAG !== `v${p.version}`) process.exit(1)'
      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-${{ runner.arch }}-bun-${{ hashFiles('.bun-version', 'bun.lock') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-bun-
      - run: bun install --frozen-lockfile
      # Tests open SQLite with synchronous=FULL in the temporary directory, which defaults to C:.
      # The hosted runner's D: drive, which also holds the workspace, is faster for this I/O.
      - name: Use the D drive for temporary files on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $temp = Join-Path $env:RUNNER_TEMP "tmp"
          New-Item -ItemType Directory -Force -Path $temp | Out-Null
          "TEMP=$temp" >> $env:GITHUB_ENV
          "TMP=$temp" >> $env:GITHUB_ENV
      - run: bun run check
      - if: runner.os != 'Windows'
        run: bun run test
      # Windows runner disk stalls can slow tests tenfold for tens of seconds. Tests with their
      # own limit allow for that; this gives the rest 20 seconds instead of 5.
      - if: runner.os == 'Windows'
        run: bun run test --timeout 20000
      - run: bun run build
      - if: runner.os == 'Linux'
        run: xvfb-run -a bun run test:e2e
      - if: runner.os != 'Linux'
        run: bun run test:e2e
      - run: bun --bun electron-builder --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Test packaged application on Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a bun run test:packaged
      - name: Test packaged application on Windows and macOS
        if: runner.os != 'Linux'
        run: bun run test:packaged
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ runner.os }}
          if-no-files-found: error
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.AppImage
            release/*.deb
            release/*.blockmap
            release/*.yml
  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: artifacts
          merge-multiple: true
      - name: Hash release artifacts
        working-directory: artifacts
        run: find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
      - name: Publish release artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" artifacts/* --repo "$REPOSITORY" --verify-tag --generate-notes
