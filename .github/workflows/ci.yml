name: Verify desktop
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: Build (${{ matrix.os }})
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-${{ runner.arch }}-bun-${{ hashFiles('.bun-version', 'bun.lock') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-bun-
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run build:concepts
      - name: Run tests with temporary macOS package diagnostics
        if: runner.os == 'macOS'
        run: |
          bun - <<'BUN'
          const filename = "backend/review/packages.ts";
          const original = await Bun.file(filename).text();
          const needle = "Effect.mapError((cause) => asPackageError(cause, message))";
          const diagnostic = 'Effect.mapError((cause) => { if (message === "The application database could not be read." && !Schema.is(PackageError)(cause)) console.error("PACKAGE_SQL_DIAGNOSTIC", cause); return asPackageError(cause, message); })';
          if (!original.includes(needle)) throw new Error("Package diagnostic location changed");
          try {
            await Bun.write(filename, original.replace(needle, diagnostic));
            const child = Bun.spawn([process.execPath, "run", "test"], { stdout: "inherit", stderr: "inherit" });
            process.exitCode = await child.exited;
          } finally {
            await Bun.write(filename, original);
          }
          BUN
      - if: runner.os != 'macOS'
        run: bun run test
      - run: bun run build
      - if: runner.os == 'Linux'
        run: xvfb-run -a bun run test:e2e
      - if: runner.os != 'Linux'
        run: bun run test:e2e
      - name: Package desktop installers
        run: bun --bun electron-builder --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Test packaged application on Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a bun run test:packaged
      - name: Test packaged application on Windows and macOS
        if: runner.os != 'Linux'
        run: bun run test:packaged
      - name: Upload desktop installers
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ runner.os }}-${{ runner.arch }}
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.AppImage
            release/*.deb
