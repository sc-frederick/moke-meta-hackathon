name: Verify desktop
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: Build (${{ matrix.os }})
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-${{ runner.arch }}-bun-${{ hashFiles('.bun-version', 'bun.lock') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-bun-
      - run: bun install --frozen-lockfile
      # Tests open SQLite with synchronous=FULL in the temporary directory, which defaults to C:.
      # The hosted runner's D: drive, which also holds the workspace, is faster for this I/O.
      - name: Use the D drive for temporary files on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $temp = Join-Path $env:RUNNER_TEMP "tmp"
          New-Item -ItemType Directory -Force -Path $temp | Out-Null
          "TEMP=$temp" >> $env:GITHUB_ENV
          "TMP=$temp" >> $env:GITHUB_ENV
      - run: bun run check
      - run: bun run build:concepts
      - if: runner.os != 'Windows'
        run: bun run test
      # Windows runner disk stalls can slow tests tenfold for tens of seconds. Tests with their
      # own limit allow for that; this gives the rest 20 seconds instead of 5.
      - if: runner.os == 'Windows'
        run: bun run test --timeout 20000
      - run: bun run build
      - if: runner.os == 'Linux'
        run: xvfb-run -a bun run test:e2e
      - if: runner.os != 'Linux'
        run: bun run test:e2e
      - name: Package desktop installers
        run: bun --bun electron-builder --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Test packaged application on Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a bun run test:packaged
      - name: Test packaged application on Windows and macOS
        if: runner.os != 'Linux'
        run: bun run test:packaged
      - name: Upload desktop installers
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ runner.os }}-${{ runner.arch }}
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.AppImage
            release/*.deb
