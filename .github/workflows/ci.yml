name: Verify desktop
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - run: pnpm effect:setup
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build
      - if: runner.os == 'Linux'
        run: xvfb-run -a pnpm test:e2e
      - if: runner.os != 'Linux'
        run: pnpm test:e2e
      - run: pnpm exec electron-builder --dir --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
